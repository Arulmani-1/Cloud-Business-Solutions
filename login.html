<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="antialiased">

    <div class="min-h-screen grid md:grid-cols-2">
        <div class="hidden md:flex relative bg-slate-900 items-center justify-center p-12">
            <a href="index.html"
                class="absolute top-8 left-8 z-20 text-sm font-semibold text-white/70 hover:text-white flex items-center gap-1 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Go to Home
            </a>
            <img src="assets/images/cloud-hero.webp" alt="Login"
                class="absolute inset-0 w-full h-full object-cover opacity-30">
            <div class="relative z-10 text-center">
                <h2 class="text-4xl font-bold text-white mb-4">Welcome To Stackly</h2>
                <p class="text-blue-100 text-lg">Secure access to your digital business platform.</p>
            </div>
        </div>
        <div class="flex items-center justify-center p-8 bg-white relative">
            <a href="index.html" class="absolute top-8 left-8 flex items-center">
                <img src="assets/images/logo.webp" alt="Stackly Logo" class="h-12 w-auto object-contain">
            </a>
            <a href="index.html"
                class="absolute top-8 right-8 text-sm font-semibold text-slate-600 hover:text-blue-600 flex md:hidden items-center gap-1 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Go to Home
            </a>
            <div class="w-full max-w-md mt-16">
                <h1 class="text-3xl font-bold text-slate-900 mb-8">LOGIN</h1>
                <form id="login-form">
                    <select required
                        class="w-full mb-4 px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none text-slate-500 bg-white">
                        <option value="" disabled selected>Select Role</option>
                        <option value="client">Client</option>
                        <option value="admin">Admin</option>
                    </select>
                    <input type="email" placeholder="Email Address" required
                        class="w-full mb-4 px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">
                    <input type="password" placeholder="Password" required
                        class="w-full mb-4 px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">
                    <div class="flex justify-between items-center mb-6">
                        <label class="flex items-center text-sm text-slate-600"><input type="checkbox" class="mr-2">
                            Remember Me</label>
                        <a href="#" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 text-white px-6 py-4 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg mb-4">LOGIN</button>
                    <p id="login-success" class="text-green-600 font-semibold mt-4 text-center hidden">Login successful!
                    </p>

                    <div class="text-center my-6 text-sm text-slate-400">OR</div>
                    <div class="grid grid-cols-2 gap-4">
                        <button type="button"
                            class="border border-slate-200 px-4 py-2 rounded-lg font-semibold hover:bg-slate-50 transition-colors">Google</button>
                        <button type="button"
                            class="border border-slate-200 px-4 py-2 rounded-lg font-semibold hover:bg-slate-50 transition-colors">Apple</button>
                    </div>
                    <p class="text-center mt-8 text-sm text-slate-600">Don't have an account? <a href="signup.html"
                            class="text-blue-600 font-semibold hover:underline">Sign up</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
    <script src="js/forms.js"></script>
    <script>if (typeof AOS !== 'undefined') AOS.init({ duration: 800, once: true });</script>
</body>

</html>
